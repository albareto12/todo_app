# Docker Compose configuration for ToDo App infrastructure
# Services: PostgreSQL database and smtp4dev for email testing

services:
  db: 
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
      POSTGRES_DB: todo_db
    volumes:  
      - db_data:/var/lib/postgresql/data  
    ports:
      - "5432:5432"
    networks:
      - todo_network
    
  smtp:
    image: rnwood/smtp4dev:latest
    restart: unless-stopped
    ports:
      - "3000:80"   # UI web de smtp4dev
      - "25:25"     # puerto SMTP
    networks:
      - todo_network

  # Descomentar cuando el directorio backend exista con su Dockerfile
  # web:
